<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>CYBER SPRINT: VELOCITY RUN</title>
  <style>
    @import url('https://fonts.googleapis.com/css2?family=Orbitron:wght@600;800;900&family=Rajdhani:wght@500;700&display=swap');

    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      overflow: hidden;
      background: #020108;
      font-family: 'Rajdhani', sans-serif;
      user-select: none;
      color: #fff;
    }

    /* Screen Overlays */
    .overlay-screen {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      background: radial-gradient(circle at center, rgba(12, 10, 30, 0.75) 0%, rgba(2, 1, 8, 0.95) 100%);
      backdrop-filter: blur(8px);
      z-index: 30;
      transition: opacity 0.4s ease, visibility 0.4s;
    }
    .overlay-screen.hidden {
      opacity: 0;
      visibility: hidden;
      pointer-events: none;
    }

    .title-wrapper {
      text-align: center;
      margin-bottom: 25px;
    }

    .main-title {
      font-family: 'Orbitron', sans-serif;
      font-size: 64px;
      font-weight: 900;
      letter-spacing: 6px;
      text-transform: uppercase;
      background: linear-gradient(180deg, #ffffff 0%, #00f0ff 45%, #ff007f 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      filter: drop-shadow(0 0 25px rgba(0, 240, 255, 0.6));
    }

    .subtitle {
      font-family: 'Orbitron', sans-serif;
      font-size: 15px;
      letter-spacing: 8px;
      color: #ff007f;
      text-shadow: 0 0 10px #ff007f;
      margin-top: 5px;
    }

    .pulse-btn-badge {
      font-family: 'Orbitron', sans-serif;
      font-size: 20px;
      letter-spacing: 3px;
      color: #fff;
      background: rgba(255, 255, 255, 0.05);
      border: 1.5px solid rgba(0, 240, 255, 0.6);
      padding: 16px 36px;
      border-radius: 40px;
      box-shadow: 0 0 25px rgba(0, 240, 255, 0.35);
      animation: pulseGlow 1.2s ease-in-out infinite alternate;
    }

    @keyframes pulseGlow {
      from { transform: scale(1); box-shadow: 0 0 15px rgba(0, 240, 255, 0.3); }
      to { transform: scale(1.05); box-shadow: 0 0 35px rgba(255, 0, 127, 0.7); border-color: #ff007f; }
    }

    .info-footer {
      position: absolute;
      bottom: 25px;
      font-size: 14px;
      color: #8c8ea8;
      letter-spacing: 1px;
    }

    /* In-Game Heads-Up Display */
    #hud {
      position: absolute;
      inset: 0;
      pointer-events: none;
      z-index: 10;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 30px;
    }

    .hud-top-bar {
      display: flex;
      justify-content: space-between;
      align-items: flex-start;
    }

    .glass-panel {
      background: linear-gradient(135deg, rgba(20, 20, 36, 0.85) 0%, rgba(8, 8, 18, 0.7) 100%);
      border: 1px solid rgba(0, 240, 255, 0.3);
      padding: 14px 22px;
      border-radius: 8px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.6);
      backdrop-filter: blur(8px);
    }

    .panel-label {
      font-size: 11px;
      letter-spacing: 2px;
      color: #798096;
      text-transform: uppercase;
    }

    .panel-value {
      font-family: 'Orbitron', sans-serif;
      font-size: 32px;
      font-weight: 800;
      color: #00f0ff;
      text-shadow: 0 0 12px rgba(0, 240, 255, 0.6);
    }

    .speed-unit {
      font-size: 14px;
      color: #798096;
      font-weight: normal;
    }

    /* Level Progress Bar */
    .hud-progress-container {
      width: 420px;
      text-align: center;
    }

    .progress-track {
      width: 100%;
      height: 10px;
      background: rgba(255, 255, 255, 0.1);
      border-radius: 5px;
      margin-top: 6px;
      overflow: hidden;
      border: 1px solid rgba(255, 255, 255, 0.15);
    }

    .progress-fill {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00f0ff, #ff007f);
      box-shadow: 0 0 12px #ff007f;
      transition: width 0.08s linear;
    }

    /* Big Speed Needle Bar at bottom center */
    .bottom-bar {
      display: flex;
      justify-content: center;
      align-items: center;
      gap: 15px;
    }

    .pedal-status {
      font-family: 'Orbitron', sans-serif;
      font-size: 13px;
      letter-spacing: 2px;
      color: #00f0ff;
      border: 1px solid rgba(0, 240, 255, 0.4);
      padding: 6px 14px;
      border-radius: 20px;
      background: rgba(0, 240, 255, 0.05);
    }
  </style>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
</head>
<body>

  <!-- Menu / Level Transition Overlay -->
  <div id="overlay" class="overlay-screen">
    <div class="title-wrapper">
      <div id="overlay-title" class="main-title">CYBER SPRINT</div>
      <div id="overlay-subtitle" class="subtitle">LEVEL 1 / 5 &bull; 400M DRAG</div>
    </div>
    <div id="pulse-prompt" class="pulse-btn-badge">PRESS ANY JOYSTICK BUTTON TO START</div>
    <div class="info-footer">Tap assigned button repeatedly to pump acceleration &bull; Keyboard: [SPACE]</div>
  </div>

  <!-- In-Game HUD -->
  <div id="hud">
    <div class="hud-top-bar">
      <!-- Speedometer Panel -->
      <div class="glass-panel" style="border-left: 4px solid #00f0ff;">
        <div class="panel-label">VELOCITY</div>
        <div class="panel-value"><span id="speed-val">0</span> <span class="speed-unit">MPH</span></div>
        <div style="font-size: 13px; color: #ff007f; font-weight: 700;">PWR: <span id="pwr-val">0%</span></div>
      </div>

      <!-- Distance & Track Progress -->
      <div class="hud-progress-container glass-panel">
        <div style="display:flex; justify-content: space-between;">
          <span class="panel-label" id="level-label">LEVEL 1 - 400M</span>
          <span class="panel-label" id="distance-rem">400M TO FINISH</span>
        </div>
        <div class="progress-track">
          <div id="progress-bar" class="progress-fill"></div>
        </div>
      </div>

      <!-- Timer Panel -->
      <div class="glass-panel" style="border-right: 4px solid #ff007f; text-align: right;">
        <div class="panel-label">RACE TIME</div>
        <div class="panel-value" style="color: #ffcc00;" id="timer-val">00:00.00</div>
        <div style="font-size: 13px; color: #8c8ea8;">BEST: <span id="best-time">--:--.--</span></div>
      </div>
    </div>

    <!-- Bottom Assist Bar -->
    <div class="bottom-bar">
      <div class="pedal-status" id="assigned-badge">BOOSTER: WAITING INPUT...</div>
    </div>
  </div>

  <script>
    // --- Levels Configuration ---
    const LEVELS = [
      { id: 1, name: "CIRCUIT INITIATION", targetDist: 400, color: 0x00f0ff },
      { id: 2, name: "NEON HIGHWAY", targetDist: 800, color: 0xff007f },
      { id: 3, name: "SYNTH WAVEWAY", targetDist: 1200, color: 0xaa00ff },
      { id: 4, name: "HYPER TUNNEL", targetDist: 1800, color: 0x00ff88 },
      { id: 5, name: "MAXIMUM VELOCITY", targetDist: 2500, color: 0xffbb00 }
    ];

    let currentLevelIndex = 0;
    let gameState = 'START'; // 'START', 'RACING', 'CLEARED', 'ALL_CLEARED'
    let raceStartTime = 0;
    let elapsedRaceTime = 0;

    // --- Audio Synthesizer (No external MP3 dependencies) ---
    const AudioContext = window.AudioContext || window.webkitAudioContext;
    let audioCtx = null;

    function playExhaustPulse() {
      if (!audioCtx) audioCtx = new AudioContext();
      if (audioCtx.state === 'suspended') audioCtx.resume();

      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();

      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(160, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(35, audioCtx.currentTime + 0.22);

      gain.gain.setValueAtTime(0.25, audioCtx.currentTime);
      gain.gain.exponentialRampToValueAtTime(0.001, audioCtx.currentTime + 0.22);

      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.22);
    }

    function playFinishCheer() {
      if (!audioCtx) return;
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(300, audioCtx.currentTime);
      osc.frequency.exponentialRampToValueAtTime(800, audioCtx.currentTime + 0.5);
      gain.gain.setValueAtTime(0.3, audioCtx.currentTime);
      gain.gain.linearRampToValueAtTime(0.01, audioCtx.currentTime + 0.5);
      osc.connect(gain);
      gain.connect(audioCtx.destination);
      osc.start();
      osc.stop(audioCtx.currentTime + 0.5);
    }

    // --- Three.js Scene Setup ---
    const scene = new THREE.Scene();
    scene.fog = new THREE.FogExp2(0x020108, 0.0016);

    const camera = new THREE.PerspectiveCamera(65, window.innerWidth / window.innerHeight, 0.1, 3000);
    const renderer = new THREE.WebGLRenderer({ antialias: true, powerPreference: 'high-performance' });
    renderer.setSize(window.innerWidth, window.innerHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;
    document.body.appendChild(renderer.domElement);

    // --- Lighting ---
    const hemiLight = new THREE.HemisphereLight(0x00f0ff, 0xff007f, 0.45);
    scene.add(hemiLight);

    const keyLight = new THREE.DirectionalLight(0xffffff, 0.9);
    keyLight.position.set(30, 80, 20);
    scene.add(keyLight);

    // --- Environment Elements ---
    const trackWidth = 20;
    const trackGeo = new THREE.PlaneGeometry(trackWidth, 4000);
    const trackMat = new THREE.MeshStandardMaterial({ color: 0x080812, roughness: 0.65, metalness: 0.3 });
    const track = new THREE.Mesh(trackGeo, trackMat);
    track.rotation.x = -Math.PI / 2;
    scene.add(track);

    // Grid Floor
    const gridCanvas = document.createElement('canvas');
    gridCanvas.width = 128; gridCanvas.height = 128;
    const gctx = gridCanvas.getContext('2d');
    gctx.strokeStyle = '#ff007f28';
    gctx.lineWidth = 2;
    gctx.strokeRect(0, 0, 128, 128);
    const gridTex = new THREE.CanvasTexture(gridCanvas);
    gridTex.wrapS = THREE.RepeatWrapping;
    gridTex.wrapT = THREE.RepeatWrapping;
    gridTex.repeat.set(120, 120);

    const floorGeo = new THREE.PlaneGeometry(4000, 4000);
    const floorMat = new THREE.MeshBasicMaterial({ map: gridTex, transparent: true, opacity: 0.6 });
    const floor = new THREE.Mesh(floorGeo, floorMat);
    floor.rotation.x = -Math.PI / 2;
    floor.position.y = -0.05;
    scene.add(floor);

    // Neon Guardrails
    const railGeo = new THREE.BoxGeometry(0.35, 0.4, 4000);
    const railMatL = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
    const railMatR = new THREE.MeshBasicMaterial({ color: 0xff007f });

    const railLeft = new THREE.Mesh(railGeo, railMatL);
    railLeft.position.set(-trackWidth / 2, 0.2, 0);
    scene.add(railLeft);

    const railRight = new THREE.Mesh(railGeo, railMatR);
    railRight.position.set(trackWidth / 2, 0.2, 0);
    scene.add(railRight);

    // Finish Line Arch and Checkered Ribbon
    const archGroup = new THREE.Group();
    const pillarGeo = new THREE.BoxGeometry(1.5, 9, 1.5);
    const topBarGeo = new THREE.BoxGeometry(trackWidth + 3, 2, 1.5);
    const archMat = new THREE.MeshStandardMaterial({ color: 0x111122, metalness: 0.8 });
    const archGlowMat = new THREE.MeshBasicMaterial({ color: 0x00ff88 });

    const pLeft = new THREE.Mesh(pillarGeo, archMat);
    pLeft.position.set(-trackWidth / 2 - 0.75, 4.5, 0);
    archGroup.add(pLeft);

    const pRight = new THREE.Mesh(pillarGeo, archMat);
    pRight.position.set(trackWidth / 2 + 0.75, 4.5, 0);
    archGroup.add(pRight);

    const topBar = new THREE.Mesh(topBarGeo, archMat);
    topBar.position.set(0, 9, 0);
    archGroup.add(topBar);

    const finishBannerGeo = new THREE.PlaneGeometry(trackWidth, 1.6);
    const finishBannerMat = new THREE.MeshBasicMaterial({ color: 0x00ff88, side: THREE.DoubleSide });
    const banner = new THREE.Mesh(finishBannerGeo, finishBannerMat);
    banner.position.set(0, 8.8, 0.8);
    archGroup.add(banner);

    scene.add(archGroup);

    // Speed warp particles
    const particleCount = 700;
    const particleGeo = new THREE.BufferGeometry();
    const particlePos = new Float32Array(particleCount * 3);
    for (let i = 0; i < particleCount * 3; i += 3) {
      particlePos[i] = (Math.random() - 0.5) * 80;
      particlePos[i + 1] = Math.random() * 22 + 0.3;
      particlePos[i + 2] = -Math.random() * 1200;
    }
    particleGeo.setAttribute('position', new THREE.BufferAttribute(particlePos, 3));
    const particleMat = new THREE.PointsMaterial({ color: 0x00f0ff, size: 0.4, transparent: true, opacity: 0.65 });
    const warpStars = new THREE.Points(particleGeo, particleMat);
    scene.add(warpStars);

    // --- Race Car Mesh Construction ---
    const car = new THREE.Group();

    // Body
    const bodyGeo = new THREE.BoxGeometry(2.1, 0.65, 4.5);
    const bodyMat = new THREE.MeshStandardMaterial({ color: 0x0c0c16, metalness: 0.9, roughness: 0.15 });
    const body = new THREE.Mesh(bodyGeo, bodyMat);
    body.position.y = 0.55;
    car.add(body);

    // Windshield / Cabin
    const cabinGeo = new THREE.BoxGeometry(1.4, 0.5, 2.1);
    const cabinMat = new THREE.MeshStandardMaterial({ color: 0x00f0ff, roughness: 0.1, metalness: 0.9 });
    const cabin = new THREE.Mesh(cabinGeo, cabinMat);
    cabin.position.set(0, 0.95, 0.2);
    car.add(cabin);

    // Spoiler
    const wingGeo = new THREE.BoxGeometry(2.5, 0.1, 0.6);
    const wingMat = new THREE.MeshStandardMaterial({ color: 0x11111a });
    const wing = new THREE.Mesh(wingGeo, wingMat);
    wing.position.set(0, 1.3, 2.0);
    car.add(wing);

    // Underglow Neon
    const underglowGeo = new THREE.PlaneGeometry(2.3, 4.3);
    const underglowMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff, side: THREE.DoubleSide });
    const underglow = new THREE.Mesh(underglowGeo, underglowMat);
    underglow.rotation.x = Math.PI / 2;
    underglow.position.y = 0.05;
    car.add(underglow);

    // Twin Exhaust Thrusters
    const flameGeo = new THREE.ConeGeometry(0.22, 1.8, 8);
    const flameMat = new THREE.MeshBasicMaterial({ color: 0x00f0ff });
    flameGeo.rotateX(Math.PI / 2);

    const leftFlame = new THREE.Mesh(flameGeo, flameMat);
    leftFlame.position.set(-0.5, 0.55, 2.8);
    leftFlame.scale.set(0, 0, 0);
    car.add(leftFlame);

    const rightFlame = new THREE.Mesh(flameGeo, flameMat);
    rightFlame.position.set(0.5, 0.55, 2.8);
    rightFlame.scale.set(0, 0, 0);
    car.add(rightFlame);

    // Wheels
    const wheels = [];
    const wheelGeo = new THREE.CylinderGeometry(0.44, 0.44, 0.38, 18);
    const wheelMat = new THREE.MeshStandardMaterial({ color: 0x14141e, roughness: 0.4 });
    wheelGeo.rotateZ(Math.PI / 2);
    const wheelCoords = [[-1.15, 0.44, 1.4], [1.15, 0.44, 1.4], [-1.15, 0.44, -1.4], [1.15, 0.44, -1.4]];
    wheelCoords.forEach(coord => {
      const w = new THREE.Mesh(wheelGeo, wheelMat);
      w.position.set(...coord);
      car.add(w);
      wheels.push(w);
    });

    scene.add(car);

    // --- Smooth Physics Engine Variables ---
    let speed = 0;              // Current smoothed velocity
    let targetSpeed = 0;        // Target velocity driven by power
    let accelForce = 0;         // Accumulated drive impulse
    const maxSpeed = 320;       // Max ceiling
    const friction = 0.985;     // Rolling aerodynamic drag
    const boostPower = 8.5;     // Energy added per tap

    // Gamepad button edge latching
    let boundButtonIndex = null;
    let boundButtonWasPressed = false;
    let spaceWasPressed = false;

    // UI Cache
    const overlay = document.getElementById('overlay');
    const overlayTitle = document.getElementById('overlay-title');
    const overlaySubtitle = document.getElementById('overlay-subtitle');
    const pulsePrompt = document.getElementById('pulse-prompt');
    const speedVal = document.getElementById('speed-val');
    const pwrVal = document.getElementById('pwr-val');
    const distanceRem = document.getElementById('distance-rem');
    const levelLabel = document.getElementById('level-label');
    const progressBar = document.getElementById('progress-bar');
    const timerVal = document.getElementById('timer-val');
    const bestTimeVal = document.getElementById('best-time');
    const assignedBadge = document.getElementById('assigned-badge');

    function setupLevel(index) {
      const lvl = LEVELS[index];
      car.position.set(0, 0, 0);
      speed = 0;
      targetSpeed = 0;
      accelForce = 0;
      archGroup.position.set(0, 0, -lvl.targetDist);
      levelLabel.innerText = `LVL ${lvl.id} - ${lvl.name}`;
      railMatL.color.setHex(lvl.color);
      underglowMat.color.setHex(lvl.color);
      progressBar.style.width = '0%';
    }
    setupLevel(0);

    function startRun(btnIdx) {
      if (boundButtonIndex === null && typeof btnIdx === 'number') {
        boundButtonIndex = btnIdx;
      }
      assignedBadge.innerText = `BOOSTER: ${boundButtonIndex !== null ? 'BUTTON [' + boundButtonIndex + ']' : 'SPACEBAR'}`;
      gameState = 'RACING';
      raceStartTime = performance.now();
      overlay.classList.add('hidden');
      injectAcceleration();
    }

    // --- Smooth Acceleration Injection ---
    function injectAcceleration() {
      // Rather than a discontinuous speed jump, we add to the impulse pool.
      accelForce = Math.min(accelForce + boostPower, 55);

      // Visual Flame Expansion
      leftFlame.scale.set(1.4, 2.6, 1.4);
      rightFlame.scale.set(1.4, 2.6, 1.4);
      playExhaustPulse();
    }

    function formatTime(ms) {
      const min = Math.floor(ms / 60000);
      const sec = Math.floor((ms % 60000) / 1000);
      const hundredths = Math.floor((ms % 1000) / 10);
      return `${min.toString().padStart(2, '0')}:${sec.toString().padStart(2, '0')}.${hundredths.toString().padStart(2, '0')}`;
    }

    // --- Input Listeners ---
    window.addEventListener('keydown', (e) => {
      if (e.code === 'Space') {
        if (gameState === 'START' || gameState === 'CLEARED') {
          startRun('SPACE');
        } else if (gameState === 'RACING' && !spaceWasPressed) {
          injectAcceleration();
        }
        spaceWasPressed = true;
      }
    });
    window.addEventListener('keyup', (e) => {
      if (e.code === 'Space') spaceWasPressed = false;
    });

    let introAngle = 0;

    // --- Main Game Loop ---
    function animate() {
      requestAnimationFrame(animate);

      // 1. Poll Gamepads
      const gamepads = navigator.getGamepads ? navigator.getGamepads() : [];
      const gp = gamepads[0] || gamepads[1];

      if (gp && gp.buttons) {
        if (gameState === 'START' || gameState === 'CLEARED') {
          for (let i = 0; i < gp.buttons.length; i++) {
            const btn = gp.buttons[i];
            const pressed = (typeof btn === 'object') ? btn.pressed : (btn === 1.0);
            if (pressed) {
              startRun(i);
              boundButtonWasPressed = true;
              break;
            }
          }
        } else if (gameState === 'RACING') {
          const target = gp.buttons[boundButtonIndex ?? 0];
          if (target) {
            const pressed = (typeof target === 'object') ? target.pressed : (target === 1.0);
            if (pressed && !boundButtonWasPressed) {
              injectAcceleration();
            }
            boundButtonWasPressed = pressed;
          }
        }
      }

      // 2. Smooth Physical Progression
      // Dissipate acceleration force into forward speed smoothly over time
      targetSpeed += accelForce * 0.45;
      accelForce *= 0.88; // Power decay

      // Smoothly interpolate current speed towards target speed (eliminates jarring jumps)
      speed += (targetSpeed - speed) * 0.12;
      targetSpeed *= friction;

      if (speed < 0.05) speed = 0;

      // Shrink Thrusters
      leftFlame.scale.lerp(new THREE.Vector3(0, 0, 0), 0.16);
      rightFlame.scale.lerp(new THREE.Vector3(0, 0, 0), 0.16);

      // 3. State Management & Camera Tracking
      const currentTarget = LEVELS[currentLevelIndex].targetDist;
      const currentDist = Math.abs(car.position.z);

      if (gameState === 'RACING') {
        // Move Car
        car.position.z -= speed * 0.022;
        wheels.forEach(w => w.rotation.x -= speed * 0.05);

        // Update Timer & HUD
        elapsedRaceTime = performance.now() - raceStartTime;
        timerVal.innerText = formatTime(elapsedRaceTime);

        const remaining = Math.max(0, currentTarget - currentDist);
        distanceRem.innerText = `${Math.round(remaining)}M REMAINING`;
        progressBar.style.width = `${Math.min(100, (currentDist / currentTarget) * 100)}%`;
        speedVal.innerText = Math.round(speed);
        pwrVal.innerText = `${Math.round((speed / maxSpeed) * 100)}%`;

        // Follow Camera with Smooth FOV Expansion & dynamic micro-shake
        const shake = (speed / maxSpeed) * 0.04;
        const camShakeX = (Math.random() - 0.5) * shake;
        const camShakeY = (Math.random() - 0.5) * shake;

        const desiredCam = new THREE.Vector3(
          car.position.x + camShakeX,
          car.position.y + 3.8 + (speed * 0.005) + camShakeY,
          car.position.z + 10.5 + (speed * 0.018)
        );
        camera.position.lerp(desiredCam, 0.14);
        camera.lookAt(car.position.x, car.position.y + 1.0, car.position.z - 20);
        camera.fov = 65 + (speed / maxSpeed) * 14;
        camera.updateProjectionMatrix();

        // Check Finish Line Crossing
        if (currentDist >= currentTarget) {
          playFinishCheer();
          gameState = 'CLEARED';

          if (currentLevelIndex < LEVELS.length - 1) {
            overlayTitle.innerText = "STAGE CLEARED!";
            overlaySubtitle.innerText = `STAGE TIME: ${formatTime(elapsedRaceTime)} &bull; READY FOR LEVEL ${currentLevelIndex + 2}`;
            pulsePrompt.innerText = "PRESS ANY BUTTON FOR NEXT LEVEL";
            currentLevelIndex++;
          } else {
            overlayTitle.innerText = "CHAMPION!";
            overlaySubtitle.innerText = `ALL 5 CIRCUITS DOMINATED! FINAL TIME: ${formatTime(elapsedRaceTime)}`;
            pulsePrompt.innerText = "PRESS ANY BUTTON TO PLAY AGAIN";
            currentLevelIndex = 0;
          }

          bestTimeVal.innerText = formatTime(elapsedRaceTime);
          overlay.classList.remove('hidden');
          setupLevel(currentLevelIndex);
        }

      } else {
        // Idle cinematic camera revolving around the car
        introAngle += 0.015;
        camera.position.x = car.position.x + Math.sin(introAngle) * 8.5;
        camera.position.z = car.position.z + Math.cos(introAngle) * 8.5;
        camera.position.y = 2.8 + Math.sin(introAngle * 0.5) * 0.4;
        camera.lookAt(car.position.x, car.position.y + 0.6, car.position.z);
      }

      // Infinite road & particle recycle
      if (track.position.z - car.position.z > 600) {
        track.position.z -= 1200;
        floor.position.z -= 1200;
        railLeft.position.z -= 1200;
        railRight.position.z -= 1200;
      }
      const pArray = particleGeo.attributes.position.array;
      for (let i = 2; i < pArray.length; i += 3) {
        if (pArray[i] > car.position.z + 50) {
          pArray[i] = car.position.z - 1100;
        }
      }
      particleGeo.attributes.position.needsUpdate = true;

      renderer.render(scene, camera);
    }

    // Responsive Canvas
    window.addEventListener('resize', () => {
      camera.aspect = window.innerWidth / window.innerHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(window.innerWidth, window.innerHeight);
    });

    animate();
  </script>
</body>
</html>
